###########################################
## YAML config file
## Setup for full run on mimic.
## Default configuration, for example regarding coverage, statistics etc.
## is stored in "config.yaml" and loaded automatically in the Snakefile.
##
## To run this study, go to the base of the snakemake folder and run:
## `snakemake all --configfile config/testdata_config.yaml`
##
############################################


# Random seed for reproducibility (overrides default)
seed: 42


pipeline_dir: "~/bitbucket/davidkr2/development_AAV_integration/read_simulation"

# Organism reference genome:
genome_fnam: "~/bitbucket/davidkr2/development_AAV_integration/read_simulation/test_run/test_ref.fa"

# AAV genome:
AAV_genome_fnam: "~/bitbucket/davidkr2/development_AAV_integration/read_simulation/test_run/test_AAV.fa"

# Target enrichment panel:
# tes_panel_fnam: "~/bitbucket/davidkr2/development_AAV_integration/read_simulation/test_run/test_tes_panel.fa"
tes_panel_fnam: "~/bitbucket/davidkr2/development_AAV_integration/read_simulation/test_run/test_AAV.fa"


workdir: "/Users/davidkr2/bitbucket/davidkr2/development_AAV_integration/read_simulation/test_run"
# Specify run name, otherwise a new unique run name will be generated:
# run_name: "testrun"
keep_intermediate: True
threads: 15
repeats: 2




integration:
    sampling_prob_bed: "./genome_integration_site_probs.bed"

    # How many integration events:
    events: 10

    # How many allelles of the same integration event are
    # in the sample? E.g. if a cell with AAV integration has multiplied:
    expansion: 1

    # Size of AAV integration (drawn from a gamma distribution)
    # mean, stdev, min, min (optional)
    size: "200,50,25"

    aav:
        # gamma_biased_stick,mean,stdev,min,tolerance,max_iter
        method: "gamma_biased_stick,500,100,100,50,1000"
        prob_file: "./AAV_breakpoint_probs.bed"


# Parameters for preparing for read simulation:
read_sim:
    # Number of reads simulated from the genome
    # and submitted to target enrichment, then added
    # to the integration reads.
    genome_reads: 100000
    # Number of episomal AAV reads to simulate:
    episomal_reads: 50






