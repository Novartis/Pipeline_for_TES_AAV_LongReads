#############################################
# YAML config template file for simulations #
#############################################


# Specify run name:
run_name: "<run_name>"

# Organism reference genome:
genome_fnam: "<genome>"

# AAV genome:
AAV_genome_fnam: "<AAV_genome>"

# Target enrichment panel:
tes_panel_fnam: "<tes_panel>"



# Parameters related to AAV integration:
integration:
    # How many integration events:
    events: "<events>"

    # How many allelles of the same integration event are
    # in the sample? E.g. if a cell with AAV integration has multiplied:
    expansion: "<expansion>"
    # AAV fragment generation:
    aav:
        # BED file with breakpoint probabilities:
        prob_file: "<AAV_breakpoint_probabilities>"

        # Empirical fragment sizes for empirical_kde method:
        empirical_sizes: "<AAV_fragment_sizes>"

    # BED file with sampling probabilities for integration sites:
    sampling_prob_bed: "<integration_site_probabilities>"


